<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>魔法石单词本 · Harry Potter 英语单词训练</title>
<meta name="description" content="按《哈利·波特与魔法石》章节一章一章背单词：1,600+ 个动词、形容词、副词、名词和 160+ 个魔法世界专有名词，带音标、中文释义、例句、闪卡、测验和拼写练习。">
<meta name="theme-color" content="#1D6A4D">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23A3392F'/><path d='M9.5 11.2c2.4-.8 4.4-.6 6.5.8 2.1-1.4 4.1-1.6 6.5-.8v9.6c-2.4-.8-4.4-.6-6.5.8-2.1-1.4-4.1-1.6-6.5-.8z M16 12v9.6' fill='none' stroke='%23FAFBF7' stroke-width='1.6' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Charis+SIL:ital@0;1&display=swap">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one reading column (max 1080px) — home = hero + chapter grid; chapter = header + word ledger; sessions = single centred card. */
:root{
  --bg:#EEF0EA;          /* pale stone, tinted toward the emerald ink */
  --surface:#FAFBF7;
  --sunk:#E4E8E0;
  --ink:#1B2420;
  --muted:#5B6862;
  --line:#D3D9CF;
  --accent:#1D6A4D;      /* emerald ink of the Hogwarts letter */
  --accent-ink:#FFFFFF;
  --accent-weak:#D8E9DF;
  --gold:#9A7417;        /* mastered — house-point gold */
  --gold-weak:#F1E6C6;
  --wax:#A3392F;         /* sealing wax — wrong / forgotten */
  --wax-weak:#F4DEDA;
  --amber:#A8670F;
  --amber-weak:#F5E6CC;
  --shadow:0 1px 2px rgba(27,36,32,.06),0 6px 18px rgba(27,36,32,.06);
  --f-display:"IM Fell English","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --f-text:"Spectral","Iowan Old Style",Georgia,"Times New Roman",serif;
  --f-ipa:"Charis SIL","Gentium Plus","Doulos SIL","Lucida Sans Unicode","Segoe UI",sans-serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1318;--surface:#161D24;--sunk:#1C252D;--ink:#E7E5DC;--muted:#98A39C;--line:#2A343D;
  --accent:#62C79B;--accent-ink:#0B1A13;--accent-weak:#173328;--gold:#E2BA5C;--gold-weak:#3A3020;
  --wax:#E58175;--wax-weak:#3E2422;--amber:#E5A54B;--amber-weak:#3B2D1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1318;--surface:#161D24;--sunk:#1C252D;--ink:#E7E5DC;--muted:#98A39C;--line:#2A343D;
  --accent:#62C79B;--accent-ink:#0B1A13;--accent-weak:#173328;--gold:#E2BA5C;--gold-weak:#3A3020;
  --wax:#E58175;--wax-weak:#3E2422;--amber:#E5A54B;--amber-weak:#3B2D1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto}
[lang="en"]{font-family:var(--f-text)}
.ph{font-family:var(--f-ipa);color:var(--muted);font-size:.92em;white-space:nowrap}
.eyebrow{font-family:var(--f-display);letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--accent);margin:0}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.top .wrap{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand .seal{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.25rem;letter-spacing:.02em;white-space:nowrap}
.spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="cloud"] i{background:var(--accent)}
.sync[data-s="saving"] i,.sync[data-s="connecting"] i{background:var(--amber)}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn svg{width:18px;height:18px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:28px;align-items:center;padding-block:36px 20px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.2rem,5vw,3.3rem);line-height:1.05;margin:.3rem 0 .6rem;text-wrap:balance}
.lede{color:var(--muted);max-width:60ch;margin:0 0 18px}
.lede b{color:var(--ink);font-weight:600}
.today{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
.btn small{font-weight:400;opacity:.8}
.glass{margin:0;text-align:center}
.glass svg{width:150px;height:auto;display:block;margin:0 auto}
.glass figcaption{font-size:.8rem;color:var(--muted);margin-top:6px}
.glass figcaption b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.6rem;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-block:8px 26px}
.kpis div{background:var(--surface);padding:12px 14px}
.kpis dt{font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.kpis dd{margin:0;font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpis .due dd{color:var(--amber)}
.kpis .mas dd{color:var(--gold)}

/* filters */
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;padding:14px 16px;border:1px dashed var(--line);border-radius:var(--r)}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.frow > span{font-size:.78rem;color:var(--muted);width:4.5em;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="false"]{color:var(--muted)}
.filters .chip[aria-pressed="false"]{text-decoration:line-through;text-decoration-color:var(--muted)}
.chip .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.78rem}

/* chapter grid */
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sect-h h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0}
.sect-h p{margin:0;color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.chap{display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;transition:border-color .15s,transform .15s}
.chap:hover{border-color:var(--accent);transform:translateY(-1px)}
.chap-num{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;color:var(--accent)}
.chap-num span{font-family:var(--f-ui);letter-spacing:0;color:var(--muted);text-transform:none}
.chap h3{font-family:var(--f-text);font-weight:500;font-size:1.08rem;line-height:1.3;margin:2px 0 0;text-wrap:balance}
.chap .zh{margin:0;color:var(--muted);font-size:.86rem}
.bar{display:flex;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:8px}
.bar .k{background:var(--gold)}
.bar .l{background:var(--accent)}
.chap-stats{display:flex;gap:14px;margin:6px 0 0;font-size:.78rem;color:var(--muted)}
.chap-stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chap-stats .d b{color:var(--amber)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* chapter page */
.crumbs{padding-block:18px 0;font-size:.85rem}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.chead{padding-block:12px 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.chead h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.9rem,4.4vw,2.7rem);line-height:1.1;margin:.3rem 0 .2rem;text-wrap:balance}
.chead .zh{margin:0 0 14px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.mode{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-decoration:none}
.mode:hover{border-color:var(--accent)}
.mode b{font-size:1rem}
.mode span{font-size:.8rem;color:var(--muted)}
.mode.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mode.main span{color:inherit;opacity:.85}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1 1 200px;min-width:0;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.ledger{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:36px minmax(0,13rem) minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--accent-weak) 35%,transparent)}
.row .w{min-width:0}
.row .en{font-family:var(--f-text);font-size:1.08rem;font-weight:500;overflow-wrap:anywhere}
.row .ph{display:block;font-size:.82rem}
.row .m{min-width:0;font-size:.9rem}
.tag{display:inline-block;font-size:.7rem;line-height:1.5;padding:0 6px;border-radius:5px;background:var(--sunk);color:var(--muted);margin-right:6px;vertical-align:1px;white-space:nowrap}
.tag.magic{background:var(--accent-weak);color:var(--accent)}
.st{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pill{font-size:.72rem;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.pill.s-new{color:var(--muted);border-color:var(--line)}
.pill.s-learning{background:var(--accent-weak);color:var(--accent)}
.pill.s-mastered{background:var(--gold-weak);color:var(--gold)}
.pill.s-known{background:var(--sunk);color:var(--muted)}
.pill.s-due{background:var(--amber-weak);color:var(--amber)}
.say{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted)}
.say:hover{color:var(--accent);border-color:var(--accent)}
.say svg{width:15px;height:15px}
.kn{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;color:var(--muted);white-space:nowrap;cursor:pointer}
.kn input{accent-color:var(--accent);margin:0}
.more{grid-column:2 / -1;display:none;padding:4px 0 2px;font-size:.88rem;color:var(--muted)}
.row.open .more{display:block}
.more .ex{font-family:var(--f-text);font-size:1rem;color:var(--ink);font-style:italic;margin:2px 0 4px}
mark{background:none;color:var(--accent);font-weight:600;font-style:normal}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pager a{text-decoration:none;color:var(--muted);font-size:.9rem}
.pager a:hover{color:var(--accent)}

/* sessions */
.sess{max-width:680px;margin:0 auto;padding-block:20px}
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sbar a{font-size:.85rem;color:var(--muted);text-decoration:none;white-space:nowrap}
.sbar a:hover{color:var(--accent)}
.prog{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.sbar .count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px 24px 24px;min-height:300px;display:flex;flex-direction:column;gap:12px}
.card .src{position:absolute;top:12px;right:14px;font-size:.72rem;color:var(--muted)}
.card .big{font-family:var(--f-text);font-weight:500;font-size:clamp(2rem,7vw,2.9rem);line-height:1.1;margin:18px 0 0;text-align:center;overflow-wrap:anywhere}
.card .bigzh{font-size:clamp(1.4rem,5vw,1.9rem);font-weight:600;text-align:center;margin:22px 0 0}
.card .sub{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.card .sub .ph{font-size:1.05rem}
.back{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.back .cn{font-size:1.15rem;font-weight:600}
.back .ex{font-family:var(--f-text);font-size:1.08rem;font-style:italic}
.back .meta{font-size:.8rem;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.grade{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.grade small{font-weight:400;font-size:.72rem;color:var(--muted)}
.grade.g0{color:var(--wax)}.grade.g0:hover{background:var(--wax-weak);border-color:var(--wax)}
.grade.g1{color:var(--amber)}.grade.g1:hover{background:var(--amber-weak);border-color:var(--amber)}
.grade.g2{color:var(--accent)}.grade.g2:hover{background:var(--accent-weak);border-color:var(--accent)}
.grade.g3{color:var(--gold)}.grade.g3:hover{background:var(--gold-weak);border-color:var(--gold)}
.reveal{width:100%;margin-top:14px;padding:13px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
.kbd{font-size:.72rem;color:var(--muted);text-align:center;margin-top:10px}
.kbd kbd{font-family:var(--f-ui);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
.opts{display:grid;gap:8px;margin-top:6px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);line-height:1.35}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--sunk);font-size:.75rem;color:var(--muted)}
.opt.right{border-color:var(--accent);background:var(--accent-weak)}
.opt.wrong{border-color:var(--wax);background:var(--wax-weak)}
.opt[disabled]{cursor:default}
.prompt-ex{font-family:var(--f-text);font-size:1.25rem;line-height:1.5;text-align:center;margin:16px 0 0}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);color:var(--accent);font-style:normal}
.fb{border-radius:10px;padding:12px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--accent-weak)}
.fb.no{background:var(--wax-weak)}
.fb .ex{font-family:var(--f-text);font-style:italic}
.spell-in{width:100%;font-family:var(--f-text);font-size:1.5rem;text-align:center;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg)}
.spell-in:focus{border-color:var(--accent);outline:none}
.spell-in.ok{border-color:var(--accent)}
.spell-in.no{border-color:var(--wax)}
.hint{font-family:var(--f-ipa);letter-spacing:.25em;text-align:center;color:var(--muted);min-height:1.5em}
.row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.setup{display:flex;flex-direction:column;gap:16px}
.setup h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.6rem}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg .chip{padding:8px 14px}
.result h3{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:4px 0 0}
.result .score{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.miss{list-style:none;padding:0;margin:8px 0 0;border-top:1px solid var(--line)}
.miss li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.miss li span:first-child{font-family:var(--f-text);font-weight:500;min-width:9em}
.diff .bad{color:var(--wax);text-decoration:line-through}
.diff .good{color:var(--accent);font-weight:600}

/* settings sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:grid;place-items:end center}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
@media (min-width:640px){.scrim{place-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.sheet label.lbl{font-size:.8rem;color:var(--muted);display:block;margin-bottom:6px}
.sheet .note{font-size:.8rem;color:var(--muted);margin:0}
.danger{color:var(--wax);border-color:var(--wax)!important}


/* original-book sentences (from the reader's own epub) */
.orig{margin:0;padding:10px 12px;border-radius:8px;background:var(--sunk);font-family:var(--f-text);font-size:1.02rem;line-height:1.5;color:var(--ink);text-align:left}
.card > .orig{margin-top:6px}
.olabel{display:block;font-family:var(--f-ui);font-size:.7rem;letter-spacing:.06em;color:var(--muted);margin-bottom:2px;font-style:normal}
.ex .olabel{display:inline;margin:0 8px 0 0}
.more .orig{margin:4px 0 6px}
.bookbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;padding:14px 16px;border:1px solid var(--accent);border-radius:var(--r);background:var(--accent-weak);margin-bottom:18px}
.bookbox > div{flex:1 1 320px;min-width:0}
.bookbox p{margin:4px 0 0;font-size:.85rem;color:var(--muted)}
.bookbox .bookmsg{color:var(--wax);font-weight:500}
.bookbox .btn{position:relative;cursor:pointer}
.bookbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.85rem;color:var(--muted);margin-bottom:18px}
.bookbar > span{flex:1 1 auto}
.linkbtn{position:relative;background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.sheet .bookbox,.sheet .bookbar{margin-bottom:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  if (cont) {
    const m = /full-path="([^"]+)"/.exec(await cont.async('string'));
    const opfFile = m && zip.file(m[1]);
    if (opfFile) {
      const dir = m[1].includes('/') ? m[1].replace(/[^/]+$/, '') : '';

      const man = {};

      Array.from(x.getElementsByTagNameNS('*', 'itemref')).forEach(r => { const h = man[r.getAttribute('idref')]; if (h) order.push(joinPath(dir, decodeURIComponent(h.split('#')[0]))); });

  if (!order.length) order = Object.keys(zip.files).filter(p => /\.x?html?$/i.test(p)).sort();
  const normT = t => t.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9']+/g, ' ').trim();
  const titles = CH.map(c => normT(c.en));
  const chText = {}, all = []; let cur = 0;
  for (const path of order) {
    const f = zip.file(path); if (!f) continue;
    const dom = new DOMParser().parseFromString(await f.async('string'), 'text/html');
    const heads = Array.from(dom.querySelectorAll('h1,h2,h3,h4,h5,h6')).map(h => normT(h.textContent)).filter(Boolean);
    let paras = Array.from(dom.querySelectorAll('p')).map(p => p.textContent.replace(/\s+/g, ' ').trim()).filter(Boolean);

  const res = {}; let found = 0;
  ITEMS.forEach(it => {
    const rx = itemRx(it);
    const chs = byCh[0] ? [0] : [it.ch].concat((it.cs || []).filter(c => c !== it.ch));
    const hits = [];
    for (const c of chs) {

  try { localStorage.setItem(BK, JSON.stringify(BOOK)); } catch(e) { BOOK.mem = 1; }
}

/* ---------- progress: [box, dueDay, lastMs, right, wrong, known] ---------- */
const P = {}; const META = {days:{}};
const IV = [0,1,2,4,7,15,30];
function today(){ const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
function dayKey(n){ return new Date(n*864e5).toISOString().slice(0,10); }
function status(id){ const s = P[id]; if (!s) return 'new'; if (s[5]) return 'known'; if (s[0] >= 4) return 'mastered'; if (s[0] === 0) return 'new'; return 'learning'; }
function isDue(id){ const s = P[id]; return !!s && !s[5] && s[0] >= 1 && s[1] <= today(); }
function fresh(){ return [0, today(), 0, 0, 0, 0]; }
function grade(id, g){
  const t = today(); const s = (P[id] || fresh()).slice(); let b = s[0];
  if (g === 0) { b = 1; s[1] = t; s[4]++; }
  else if (g === 1) { b = Math.max(1, b); s[1] = t + 1; s[3]++; }
  else if (g === 2) { b = Math.min(6, b + 1); s[1] = t + IV[b]; s[3]++; }
  else { b = Math.min(6, Math.max(b + 2, 4)); s[1] = t + IV[b]; s[3]++; }
  s[0] = b; s[2] = Date.now(); s[5] = 0; P[id] = s; touch(id, true);
}
function nextIv(id, g){
  const s = P[id] || fresh(); let b = s[0];
  if (g === 0) return '今天'; if (g === 1) return '1天';
  b = g === 2 ? Math.min(6, b + 1) : Math.min(6, Math.max(b + 2, 4));
  return IV[b] + '天';
}
function quizMark(id, ok){

  if (ok) { s[3]++; if (s[0] === 0) { s[0] = 1; s[1] = t + 1; } else if (!s[5] && s[1] <= t) { s[0] = Math.min(6, s[0] + 1); s[1] = t + IV[s[0]]; } }
  else { s[4]++; s[5] = 0; s[0] = 1; s[1] = t; }
  s[2] = Date.now(); P[id] = s; touch(id, true);
}
function setKnown(id, on){

}
function streak(){

/* ---------- storage: browser cache + private cloud copy ---------- */
const LSK = 'hpvocab-progress-v1';

let lsT = null;
function saveLocal(){ clearTimeout(lsT); lsT = setTimeout(() => { try { localStorage.setItem(LSK, JSON.stringify({p:P, m:META})); } catch(e){} }, 300); }
let cloud = null; const dirty = new Set(), inflight = new Set(); let flushT = null;
function touch(id, counted){
  const it = BYID[id]; if (it) dirty.add(docOf(it));
  if (counted) { const k = dayKey(today()); META.days[k] = (META.days[k]||0) + 1; dirty.add('meta'); }
  saveLocal(); scheduleCloud();
}
function subset(k){ const o = {}; for (const id in P) { const it = BYID[id]; if (it && docOf(it) === k) o[id] = P[id]; } return o; }
function trimDays(){ const keys = Object.keys(META.days).sort(); while (keys.length > 400) delete META.days[keys.shift()]; }
function setSync(s){
  const el = document.getElementById('sync'); if (!el) return;
  el.dataset.s = s;
  el.querySelector('span').textContent = {cloud:'已云端同步', saving:'保存中…', connecting:'连接中…', local:'本机保存'}[s] || '本机保存';
  el.title = s === 'local' ? '进度保存在这个浏览器里' : '进度保存在你的账号里，换设备也能继续';
}
function scheduleCloud(){ if (!cloud) return; clearTimeout(flushT); flushT = setTimeout(flush, 1500); }
async function flush(){
  if (!cloud) return;
  for (const k of [...dirty]) {
    if (inflight.has(k)) continue;
    dirty.delete(k); inflight.add(k); setSync('saving');
    try {
      if (k === 'meta') { trimDays(); await cloud.col.doc('meta').set({days:META.days, t:Date.now()}); }
      else await cloud.col.doc(k).set({p:subset(k), t:Date.now()});

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && cloud && dirty.size) { clearTimeout(flushT); flush(); } });
async function initCloud(){
  if (!window.claude || typeof window.claude.use !== 'function') { setSync('local'); return; }
  setSync('connecting');
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user || typeof user.id !== 'function') { setSync('local'); return; }
    const uid = await user.id(); if (!uid) { setSync('local'); return; }
    const col = db.collection('data/users/' + uid);
    const snap = await col.get();
    const remote = {};
    snap.docs.forEach(d => {
      if (!d.exists) return; const body = d.data() || {};
      if (d.id === 'meta') { const days = body.days || {}; for (const k in days) META.days[k] = Math.max(META.days[k]||0, days[k]||0); remote.meta = JSON.stringify(days); return; }
      const p = body.p || {}; remote[d.id] = p;
      for (const id in p) { const r = p[id]; if (!Array.isArray(r) || !BYID[id]) continue; const l = P[id]; if (!l || (r[2]||0) > (l[2]||0)) P[id] = r.slice(); }
    });

/* ---------- flashcards ---------- */
function startCards(n){
  const pool = n ? chItems(n) : ITEMS.filter(passes);
  const due = pool.filter(it => isDue(it.id)).sort((a,b) => P[a.id][1] - P[b.id][1]);
  const fresh = n ? pool.filter(it => status(it.id) === 'new').sort((a,b) => b.n - a.n).slice(0, S.newPer) : [];
  const q = n ? shuffle(due).concat(fresh) : due.slice(0, 120);
  session = {type:'cards', n, q, i:0, flipped:false, done:0, stats:[0,0,0,0], total:q.length, back: n ? `#ch${n}` : '#'};

}
function renderCardsEmpty(n){

    <p style="color:var(--muted);margin:0">${n ? '新词都已经学过，到期的复习也做完了。想多练一会儿，可以把学习中的词再过一遍，或者做个测验。' : '所有到期的词都复习完了。明天再来，或者挑一章学新词。'}</p>
    <div class="row2" style="justify-content:flex-start;margin-top:8px">

      ${n ? `<a class="btn" href="#ch${n}-quiz">去做测验</a>` : ''}
      <a class="btn" href="${n?`#ch${n}`:'#'}">返回</a></div></div></div>`;
  const b = document.getElementById('extra');
  if (b) b.onclick = () => { session = {type:'cards', n, q:shuffle(learning), i:0, flipped:false, done:0, stats:[0,0,0,0], total:learning.length, back:`#ch${n}`}; renderCard(); };
}
function renderCard(){

    : `<p class="bigzh">${esc(it.cn)}</p><div class="sub">${posTag(it)}${lvTag(it)}</div>${it.ex?`<p class="prompt-ex" lang="en">${exBlank(it.ex)}</p>`:''}`;

      ${e2c ? `<div class="cn">${esc(it.cn)}</div>` : `<div class="sub" style="justify-content:flex-start"><span class="big" lang="en" style="font-size:1.9rem;margin:0;text-align:left">${esc(it.en)}</span>${it.ph?`<span class="ph">/${esc(it.ph)}/</span>`:''}${sayBtn(it.en)}</div>`}
      ${e2c ? '' : bookHTML(it)}${it.ex ? `<div class="ex" lang="en"><span class="olabel">例句</span>${exHTML(it.ex)}</div>` : ''}${it.note ? `<div>${esc(it.note)}</div>` : ''}

function gradesHTML(it){

function gradeCard(g){

  if (g === 0) { s.q.splice(Math.min(s.i + 4, s.q.length), 0, it); s.total++; }

function cardsDone(){

/* ---------- quiz ---------- */
function setupHTML(title, n, groups){
  return `<div class="sess"><div class="sbar"><a href="#ch${n}">← 第 ${n} 章</a></div><div class="card setup">
    <p class="eyebrow">第 ${n} 章 · ${esc(CH[n-1].zh)}</p><h3>${title}</h3>
    ${groups.map(g => `<div><label class="lbl" style="font-size:.8rem;color:var(--muted)">${g.label}</label><div class="seg">${g.opts.map(([v,l]) => `<button class="chip" data-set="${g.key}" data-v="${v}" aria-pressed="${String(g.val)===String(v)}">${l}</button>`).join('')}</div></div>`).join('')}

    <button class="reveal" id="go">开始</button></div></div>`;
}
const QS = {type:'mix', len:20, from:'all'};
function quizPool(n){
  let L = chItems(n);

  if (QS.type === 'cloze') L = L.filter(it => it.ex);
  return L;
}
function quizSetup(n){
  session = {type:'quizsetup', n};
  view.innerHTML = setupHTML('选择测验', n, [
    {label:'题型', key:'type', val:QS.type, opts:[['mix','混合'],['e2c','英译中'],['c2e','中译英'],['cloze','例句填空']]},
    {label:'题量', key:'len', val:QS.len, opts:[[10,'10 题'],[20,'20 题'],[50,'50 题'],[999,'全部']]},
    {label:'范围', key:'from', val:QS.from, opts:[['all','本章全部词条'],['seen','只考学过的词']]}]);
  const upd = () => { const k = quizPool(n).length; document.getElementById('poolInfo').textContent = `可出题词条 ${k} 个`; document.getElementById('go').disabled = k < 1; };
  upd();
  view.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { const k = b.dataset.set; QS[k] = k === 'len' ? +b.dataset.v : b.dataset.v; view.querySelectorAll(`[data-set="${k}"]`).forEach(x => x.setAttribute('aria-pressed', x === b)); upd(); });
  document.getElementById('go').onclick = () => startQuiz(n, shuffle(quizPool(n)).slice(0, QS.len));
}
function startQuiz(n, items){
  const qs = items.map(it => {
    let t = QS.type;
    if (t === 'mix') { const opts = ['e2c','c2e']; if (it.ex) opts.push('cloze','cloze'); t = opts[Math.floor(Math.random()*opts.length)]; }
    if (t === 'cloze' && !it.ex) t = 'e2c';
    const field = t === 'e2c' ? 'cn' : 'en';
    const ds = distractors(it, 3, field);
    return {it, t, opts: shuffle([it].concat(ds))};
  });
  session = {type:'quiz', n, qs, i:0, answered:false, right:0, miss:[], src:items};
  renderQ();
}
function distractors(it, k, field){
  const key = v => field === 'en' ? norm(v) : String(v).trim();
  const same = x => x !== it && x.kind === it.kind && (it.kind === 'p' || x.pos === it.pos) && key(x[field]) !== key(it[field]);
  const cand = shuffle(ITEMS.filter(same));
  const rank = x => (x.ch === it.ch ? 0 : 2) + (x.pos === it.pos ? 0 : 1);
  cand.sort((a, b) => rank(a) - rank(b));
  const out = [];
  for (const x of cand) { if (out.length >= k) break; if (!out.some(o => o[field] === x[field])) out.push(x); }
  if (out.length < k) for (const x of shuffle(ITEMS)) { if (out.length >= k) break; if (x !== it && x[field] !== it[field] && !out.includes(x)) out.push(x); }
  return out;
}
function renderQ(){
  const s = session; if (s.i >= s.qs.length) return quizDone();
  const {it, t, opts} = s.qs[s.i];
  let prompt = '';
  if (t === 'e2c') prompt = `<p class="big" lang="en">${esc(it.en)}</p><div class="sub">${it.ph?`<span class="ph">/${esc(it.ph)}/</span>`:''}${sayBtn(it.en)}</div>${bookHTML(it)}<p class="kbd" style="margin:0">选出正确的中文意思</p>`;
  else if (t === 'c2e') prompt = `<p class="bigzh">${esc(it.cn)}</p><div class="sub">${posTag(it)}</div><p class="kbd" style="margin:0">选出对应的英文</p>`;
  else prompt = `<p class="prompt-ex" lang="en">${exBlank(it.ex)}</p><div class="sub">${posTag(it)}</div><p class="kbd" style="margin:0">选出空格处单词的原形</p>`;
  view.innerHTML = `<div class="sess">
    <div class="sbar"><a href="#ch${s.n}">结束</a><div class="prog"><i style="width:${s.i/s.qs.length*100}%"></i></div><span class="count">${s.i+1} / ${s.qs.length}</span></div>
    <article class="card">${prompt}
      <div class="opts">${opts.map((o,k) => `<button class="opt" data-opt="${k}"><span class="k">${k+1}</span><span ${t==='e2c'?'':'lang="en"'}>${esc(t==='e2c'?o.cn:o.en)}</span></button>`).join('')}</div>
      <div id="fb"></div></article>
    <p class="kbd"><kbd>1</kbd>–<kbd>4</kbd> 作答 · <kbd>Enter</kbd> 下一题</p></div>`;
  if (S.auto && t === 'e2c') speak(it.en);
}
function answerQ(k){
  const s = session; if (!s || s.type !== 'quiz' || s.answered) return;
  const q = s.qs[s.i]; const pick = q.opts[k]; if (!pick) return;
  s.answered = true; const ok = pick === q.it;
  quizMark(q.it.id, ok); if (ok) s.right++; else s.miss.push(q.it);
  view.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (q.opts[j] === q.it) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); });
  const it = q.it;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'no'}"><div><b lang="en">${esc(it.en)}</b> ${it.ph?`<span class="ph">/${esc(it.ph)}/</span>`:''} · ${esc(it.cn)}</div>${q.t === 'e2c' ? '' : bookHTML(it)}${it.ex?`<div class="ex" lang="en">${exHTML(it.ex)}</div>`:''}${it.note?`<div>${esc(it.note)}</div>`:''}<div class="row2" style="justify-content:flex-end"><button class="btn primary" id="nextQ">下一题</button></div></div>`;
  document.getElementById('nextQ').onclick = nextQ;

}
function nextQ(){ const s = session; if (!s || !s.answered) return; s.i++; s.answered = false; if (s.type === 'quiz') renderQ(); else renderSpell(); }
function resultHTML(kind){
  const s = session; const total = kind === 'quiz' ? s.qs.length : s.items.length;
  return `<div class="sess"><div class="card result">
    <p class="eyebrow">第 ${s.n} 章 · ${kind==='quiz'?'选择测验':'拼写默写'}</p>

    ${s.miss.length ? `<p style="margin:0;color:var(--muted);font-size:.85rem">错的词已经放回复习队列，今天的闪卡里会再出现。</p><ul class="miss">${s.miss.map(it => `<li><span lang="en">${esc(it.en)}</span><span>${esc(it.cn)}</span></li>`).join('')}</ul>` : ''}
    <div class="row2" style="justify-content:flex-start">${s.miss.length?`<button class="btn primary" id="redo">只练错的 ${s.miss.length} 个</button>`:''}<button class="btn" id="more">再来一组</button><a class="btn" href="#ch${s.n}">返回本章</a></div></div></div>`;
}
function quizDone(){

/* ---------- spelling ---------- */
const SP = {len:20, from:'all'};
function spellPool(n){ let L = chItems(n); if (SP.from === 'seen') L = L.filter(it => status(it.id) !== 'new'); return L; }
function spellSetup(n){
  session = {type:'spellsetup', n};

    {label:'范围', key:'from', val:SP.from, opts:[['all','本章全部词条'],['seen','只默学过的词']]}]);
  const upd = () => { const k = spellPool(n).length; document.getElementById('poolInfo').textContent = `可默写词条 ${k} 个 · 看中文和例句、听发音，写出英文`; document.getElementById('go').disabled = k < 1; };
  upd();

}
function startSpell(n, items){ session = {type:'spell', n, items, i:0, answered:false, right:0, miss:[], hint:0}; renderSpell(); }

  const s = session; if (s.i >= s.items.length) return spellDone();
  const it = s.items[s.i]; s.hint = 0;
  view.innerHTML = `<div class="sess">
    <div class="sbar"><a href="#ch${s.n}">结束</a><div class="prog"><i style="width:${s.i/s.items.length*100}%"></i></div><span class="count">${s.i+1} / ${s.items.length}</span></div>
    <article class="card">
      <p class="bigzh">${esc(it.cn)}</p><div class="sub">${posTag(it)}${sayBtn(it.en, '读音')}</div>
      ${it.ex ? `<p class="prompt-ex" lang="en">${exBlank(it.ex)}</p>` : it.note ? `<p style="text-align:center;color:var(--muted);margin:0">${esc(it.note)}</p>` : ''}
      <form id="spf" autocomplete="off"><input class="spell-in" id="spin" lang="en" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${it.kind==='p'?'输入英文名称':'输入单词原形'}" aria-label="输入英文"></form>
      <div class="hint" id="hint"></div>
      <div class="row2"><button class="btn" id="hintBtn" type="button">提示一个字母</button><button class="btn primary" id="check" type="button">检查</button></div>
      <div id="fb"></div></article>
    <p class="kbd"><kbd>Enter</kbd> 检查 / 下一个 · <kbd>P</kbd>（输入框外）朗读</p></div>`;
  const inp = document.getElementById('spin'); inp.focus();
  document.getElementById('spf').onsubmit = e => { e.preventDefault(); s.answered ? nextQ() : checkSpell(); };
  document.getElementById('check').onclick = () => s.answered ? nextQ() : checkSpell();
  document.getElementById('hintBtn').onclick = () => { s.hint = Math.min(s.hint + 1, it.en.length); showHint(it); inp.focus(); };
  if (S.auto) speak(it.en);
}
function showHint(it){
  const w = it.en; let shown = 0;
  document.getElementById('hint').textContent = [...w].map(ch => /[a-z]/i.test(ch) ? (shown++ < session.hint ? ch : '_') : ch).join('');
}
function diffHTML(got, want){

    ${bookHTML(it)}${it.ex?`<div class="ex" lang="en">${exHTML(it.ex)}</div>`:''}</div>`;

function spellDone(){
  const s = session; view.innerHTML = resultHTML('spell');
  const r = document.getElementById('redo'); if (r) r.onclick = () => startSpell(s.n, shuffle(s.miss));
  document.getElementById('more').onclick = () => spellSetup(s.n);
}

/* ---------- settings sheet ---------- */
function openSheet(){
  const host = document.getElementById('sheetHost'); host.hidden = false;
  host.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stTitle">
    <h3 id="stTitle">学习设置</h3>
    <div><label class="lbl">每轮闪卡最多新词</label><div class="seg">${[10,20,30,50].map(v => `<button class="chip" data-s="newPer" data-v="${v}" aria-pressed="${S.newPer===v}">${v} 个</button>`).join('')}</div></div>
    <div><label class="lbl">闪卡正面</label><div class="seg"><button class="chip" data-s="dir" data-v="e2c" aria-pressed="${S.dir==='e2c'}">看英文想中文</button><button class="chip" data-s="dir" data-v="c2e" aria-pressed="${S.dir==='c2e'}">看中文想英文</button></div></div>
    <div><label class="lbl">发音</label><div class="seg"><button class="chip" data-s="accent" data-v="en-GB" aria-pressed="${S.accent==='en-GB'}">英音</button><button class="chip" data-s="accent" data-v="en-US" aria-pressed="${S.accent==='en-US'}">美音</button><button class="chip" data-s="auto" data-v="1" aria-pressed="${!!S.auto}">自动朗读</button><button class="chip" data-s="auto" data-v="0" aria-pressed="${!S.auto}">手动朗读</button></div>
      <p class="note">朗读用的是浏览器自带的语音，不同设备的声音会不一样。</p></div>
    <div><label class="lbl">原书例句</label>${bookPanel()}</div>
    <div><label class="lbl">学习进度</label><p class="note">${cloud ? '进度保存在你的账号里，换台设备打开同一个页面也能接着学。' : '进度保存在这个浏览器里（换浏览器或清除网站数据后会重新开始）。'}</p>
      <div class="seg" style="margin-top:8px"><button class="btn danger" id="reset">清空全部进度</button></div></div>
    <div class="row2" style="justify-content:flex-end"><button class="btn primary" id="closeSheet">完成</button></div>
  </div></div>`;
  host.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    const k = b.dataset.s; let v = b.dataset.v; if (k === 'newPer' || k === 'auto') v = +v;
    S[k] = v; saveSettings();
    host.querySelectorAll(`[data-s="${k}"]`).forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v) === String(v)));
  });
  const rs = document.getElementById('reset'); let armed = null;
  rs.onclick = () => {
    if (!armed) { rs.textContent = '再点一次确认清空'; armed = setTimeout(() => { armed = null; rs.textContent = '清空全部进度'; }, 4000); return; }
    clearTimeout(armed); armed = null;
    for (const id in P) { delete P[id]; }
    META.days = {}; for (let i = 1; i <= 17; i++) dirty.add('c' + String(i).padStart(2,'0')); dirty.add('meta');
    saveLocal(); scheduleCloud(); rs.textContent = '已清空'; rs.disabled = true;
  };
  document.getElementById('closeSheet').onclick = afterSheet;
  document.getElementById('scrim').onclick = e => { if (e.target.id === 'scrim') afterSheet(); };
  document.getElementById('closeSheet').focus();
}
function afterSheet(){ closeSheet(); if (!session || /setup$/.test(session.type)) route(); else if (session.type === 'cards' && session.q[session.i]) renderCard(); }
function refreshBook(inSheet){
  if (inSheet) { const host = document.getElementById('sheetHost'); const box = host.querySelector('.sheet .bookbox, .sheet .bookbar'); if (box) box.outerHTML = bookPanel(); return; }
  if (!session || /setup$/.test(session.type)) route();
}
function closeSheet(){ const host = document.getElementById('sheetHost'); if (host && !host.hidden) { host.hidden = true; host.innerHTML = ''; } }
document.getElementById('openSettings').onclick = openSheet;

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const say = e.target.closest('[data-say]'); if (say) { e.preventDefault(); e.stopPropagation(); speak(say.dataset.say); return; }
  if (e.target.closest('[data-unbook]')) { BOOK = null; bookMsg = ''; try { localStorage.removeItem(BK); } catch(err){} refreshBook(!document.getElementById('sheetHost').hidden); return; }
  const cat = e.target.closest('[data-cat]'); if (cat) { const k = cat.dataset.cat; S.cats[k] = S.cats[k] ? 0 : 1; if (!Object.values(S.cats).some(Boolean)) S.cats[k] = 1; saveSettings(); renderHome(); return; }
  const lv = e.target.closest('[data-lv]'); if (lv) { const k = lv.dataset.lv; S.lv[k] = S.lv[k] ? 0 : 1; if (!Object.values(S.lv).some(Boolean)) S.lv[k] = 1; saveSettings(); renderHome(); return; }
  const lf = e.target.closest('[data-lf]'); if (lf) { listFilter = lf.dataset.lf; view.querySelectorAll('[data-lf]').forEach(x => x.setAttribute('aria-pressed', x === lf)); const n = +(/^#ch(\d+)/.exec(location.hash)||[])[1]; if (n) fillLedger(n); return; }
  const kn = e.target.closest('.kn'); if (kn) { e.stopPropagation(); return; }
  const row = e.target.closest('.row'); if (row) { row.classList.toggle('open'); return; }
  if (e.target.id === 'flip') return;
  const g = e.target.closest('[data-grade]'); if (g) { gradeCard(+g.dataset.grade); return; }
  const o = e.target.closest('[data-opt]'); if (o && !o.disabled) { answerQ(+o.dataset.opt); return; }
});
document.addEventListener('change', async e => {
  if (e.target.matches('[data-book]')) {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const inSheet = !document.getElementById('sheetHost').hidden;
    bookBusy = true; bookMsg = ''; refreshBook(inSheet);
    try { await importBook(file); } catch (err) { bookMsg = (err && err.message) || '读取失败，请换一个文件再试。'; }
    bookBusy = false; refreshBook(inSheet);
    return;
  }
  if (e.target.matches('[data-known]')) {
    const row = e.target.closest('.row'); const id = row.dataset.id; setKnown(id, e.target.checked);
    const st = status(id); const pill = row.querySelector('.pill'); pill.className = 'pill s-' + st; pill.textContent = STL[st];
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { listQuery = e.target.value; const n = +(/^#ch(\d+)/.exec(location.hash)||[])[1]; if (n) fillLedger(n); }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const host = document.getElementById('sheetHost');
  if (!host.hidden) { if (e.key === 'Escape') afterSheet(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  const s = session; if (!s) return;
  if (s.type === 'cards') {
    const it = s.q[s.i]; if (!it) return;
    if ((e.key === ' ' || e.key === 'Enter') && !s.flipped) { e.preventDefault(); flipCard(); }
    else if (s.flipped && /^[1-4]$/.test(e.key)) { e.preventDefault(); gradeCard(+e.key - 1); }
    else if (e.key === 'p' || e.key === 'P') speak(it.en);
  } else if (s.type === 'quiz') {
    if (!s.answered && /^[1-4]$/.test(e.key)) { e.preventDefault(); answerQ(+e.key - 1); }
    else if (s.answered && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextQ(); }
    else if ((e.key === 'p' || e.key === 'P') && s.qs[s.i]) speak(s.qs[s.i].it.en);
  } else if (s.type === 'spell' && !typing) {
    if (e.key === 'p' || e.key === 'P') speak(s.items[s.i] && s.items[s.i].en);
    else if (e.key === 'Enter' && s.answered) { e.preventDefault(); nextQ(); }
  }
});

route();
initCloud();
})();

</script>
</body>
</html>
